name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      # Tests read real sessions; keep FastF1's download between runs so CI stays fast.
      - uses: actions/cache@v4
        with:
          path: apps/api/app/f1_cache
          key: fastf1-${{ hashFiles('apps/api/tests/**') }}
          restore-keys: fastf1-
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      # F1 live-timing servers reject GitHub runners, so full-session tests only run locally.
      - run: pytest -q -m "not livedata"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
